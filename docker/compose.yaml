services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kgharness}
      POSTGRES_USER: ${POSTGRES_USER:-kgharness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kgharness} -d ${POSTGRES_DB:-kgharness}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    networks: [data]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      RUN_EXECUTION_MODE: distributed
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-kgharness}
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      BUSINESS_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      BUSINESS_DB_SCHEMA: business
      RAG_STORAGE_DIR: /data/rag
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - rag-data:/data
      - agent-output:/workspace/app/output
      - agent-upload:/workspace/app/updated
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1100m
    networks: [app, data]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.agent.worker"]
    env_file: ../.env
    environment:
      RUN_EXECUTION_MODE: distributed
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-kgharness}
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      BUSINESS_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      BUSINESS_DB_SCHEMA: business
      RAG_STORAGE_DIR: /data/rag
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-2}
    volumes:
      - rag-data:/data
      - agent-output:/workspace/app/output
      - agent-upload:/workspace/app/updated
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1800m
    networks: [app, data]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rag-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.rag.worker"]
    env_file: ../.env
    environment:
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      RAG_STORAGE_DIR: /data/rag
    volumes:
      - rag-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 900m
    networks: [app, data]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      agent-worker:
        condition: service_started
    mem_limit: 128m
    networks: [app]

networks:
  app:
  data:
    internal: true

volumes:
  postgres-data:
  rag-data:
  agent-output:
  agent-upload:

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kgharness}
      POSTGRES_USER: ${POSTGRES_USER:-kgharness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kgharness} -d ${POSTGRES_DB:-kgharness}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    networks: [data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    networks: [data]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      BUSINESS_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      BUSINESS_DB_SCHEMA: business
      RAG_STORAGE_DIR: /data/rag
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      EVENT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - rag-data:/data
      - agent-output:/workspace/app/output
      - agent-upload:/workspace/app/updated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1100m
    networks: [app, data]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "celery", "-A", "app.worker.celery_app:celery_app", "worker",
        "--loglevel=INFO", "--queues=agent", "--concurrency=1",
        "--without-mingle", "--without-gossip",
        "--hostname=agent@%h"
      ]
    env_file: ../.env
    environment:
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      RAG_STORAGE_DIR: /data/rag
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      EVENT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - rag-data:/data
      - agent-output:/workspace/app/output
      - agent-upload:/workspace/app/updated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    mem_limit: 1400m
    networks: [app, data]

  ingestion-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "celery", "-A", "app.worker.celery_app:celery_app", "worker",
        "--loglevel=INFO", "--queues=ingestion", "--concurrency=2",
        "--without-mingle", "--without-gossip",
        "--hostname=ingestion@%h"
      ]
    env_file: ../.env
    environment:
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-kgharness}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kgharness}
      RAG_STORAGE_DIR: /data/rag
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      EVENT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - rag-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    mem_limit: 1100m
    networks: [app, data]

  flower:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["ops"]
    restart: unless-stopped
    command:
      [
        "celery", "-A", "app.worker.celery_app:celery_app", "flower",
        "--port=5555", "--url-prefix=flower"
      ]
    env_file: ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      EVENT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    networks: [data]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    networks: [app]

networks:
  app:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  rag-data:
  agent-output:
  agent-upload:

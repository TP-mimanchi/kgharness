[project]
name = "kgharness"
version = "0.1.0"
description = "DeepAgents and harness learning  for mutil agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "aiofiles>=23.0.0",
    "celery[redis]>=5.5.0,<6.0.0",
    "deepagents==0.5.7",
    "fastapi>=0.100.0",
    "flower>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "langgraph-checkpoint-postgres>=2.0.0",
    "llama-index-core>=0.12.0",
    "markdown>=3.5",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pgvector>=0.3.0",
    "pypdf>=3.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "ragflow-sdk>=0.1.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "redis[hiredis]>=5.2.0,<7.0.0",
    "sqlalchemy>=2.0.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
